    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #fff;
        }

        .splash-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .splash-container .background {
            position: absolute;
            top: 0;
            left: 0;
            height: 112%;
            width: 100%;
            display: flex;
        }

        .splash-container .bar {
            flex: 1;
            transition: transform 0.8s ease-in-out;
        }

        .splash-container .bar
        {
            transform: translateY(-112vh);
        }

        .loading-game .splash-container .bar {
            transform: translateY(0);
            opacity: 1;
        }

        .splash-container .bar:nth-child(1) { background: linear-gradient(to bottom, #F47B79 90%, rgba(244, 123, 121, 0) 100%); transition-delay: 0s; }
        .splash-container .bar:nth-child(2) { background: linear-gradient(to bottom, #F58D61 90%, rgba(245, 141, 97, 0) 100%); transition-delay: 0.025s; }
        .splash-container .bar:nth-child(3) { background: linear-gradient(to bottom, #F6A049 90%, rgba(246, 160, 73, 0) 100%); transition-delay: 0.05s; }
        .splash-container .bar:nth-child(4) { background: linear-gradient(to bottom, #F6CA4B 90%, rgba(246, 202, 75, 0) 100%); transition-delay: 0.075s; }
        .splash-container .bar:nth-child(5) { background: linear-gradient(to bottom, #F6F44E 90%, rgba(246, 244, 78, 0) 100%); transition-delay: 0.1s; }
        .splash-container .bar:nth-child(6) { background: linear-gradient(to bottom, #BDF947 90%, rgba(189, 249, 71, 0) 100%); transition-delay: 0.125s; }
        .splash-container .bar:nth-child(7) { background: linear-gradient(to bottom, #85FF40 90%, rgba(133, 255, 64, 0) 100%); transition-delay: 0.15s; }
        .splash-container .bar:nth-child(8) { background: linear-gradient(to bottom, #87F899 90%, rgba(135, 248, 153, 0) 100%); transition-delay: 0.175s; }
        .splash-container .bar:nth-child(9) { background: linear-gradient(to bottom, #8AF2F2 90%, rgba(138, 242, 242, 0) 100%); transition-delay: 0.2s; }
        .splash-container .bar:nth-child(10) { background: linear-gradient(to bottom, #8EAAEB 90%, rgba(142, 170, 235, 0) 100%); transition-delay: 0.225s; }
        .splash-container .bar:nth-child(11) { background: linear-gradient(to bottom, #9262E5 90%, rgba(146, 98, 229, 0) 100%); transition-delay: 0.25s; }
        .splash-container .bar:nth-child(12) { background: linear-gradient(to bottom, #9756D5 90%, rgba(151, 86, 213, 0) 100%); transition-delay: 0.275s; }
        .splash-container .bar:nth-child(13) { background: linear-gradient(to bottom, #9C4BC5 90%, rgba(156, 75, 197, 0) 100%); transition-delay: 0.3s; }

        .loading-game .splash-container .logo {
            opacity: 1;
        }

        .splash-container .logo {
            transition: opacity 0.4s;
            opacity: 0;
            position: absolute;
            background-color: #fff;
            width: 48vw;
            height: 23vw;
            border-radius: 3vw;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.26);
        }

        .splash-container .logo svg {
            width: 54%;
            height: 95%;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .splash-container .loader {
            width: 100%;
            height: 1.4vw;
            background: linear-gradient(90deg,
            #86F0F5, #F4B0F1, #FFCE52, #86F0F5,#F4B0F1, #FFCE52, #86F0F5);
            background-size: 200% 100%;
            bottom: 0;
            position: absolute;
            border-radius: 0 0 14px 14px;
            animation: move-gradient 2s linear infinite;
            border: none;
            box-sizing: border-box;
        }

        @keyframes move-gradient {
            from {
                background-position-x: 0%;
            }
            to {
                background-position-x: -100%;
            }
        }


        @media (min-aspect-ratio: 1/1) {
            .splash-container .logo {
                width: 23vw;
                height: 11vw;
                border-radius: 1.2vw;
            }

            .splash-container .loader {
                height: 0.6vw;
            }
        }
